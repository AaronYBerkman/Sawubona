<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentence builder · Sawubona</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/brand/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..600,0..100&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" />
<link rel="stylesheet" href="assets/art/paper.css" />
<link rel="stylesheet" href="src/sentence.css" />
<style>
  body { margin: 0; min-height: 100vh; }
  .page { max-width: 1280px; margin: 0 auto; padding: 40px 16px 60px; }
  .sheet { padding: 48px clamp(16px, 4vw, 56px) 44px; }
</style>
</head>
<body class="j-grid">
<main class="page"><div class="sheet j-sheet"><div id="sentences"></div></div></main>
<script type="module">
  import { mountSentenceBuilder } from './src/sentence-view.js';
  import { loadReplay } from './src/replay-data.js';
  import { createReplay } from './src/figure.js';
  import { sequenceClip } from './src/watch.js';
  const params = new URLSearchParams(location.search);
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
  const index = await fetch('data/signs.json').then((r) => r.json());
  const view = mountSentenceBuilder(document.getElementById('sentences'), {
    labels: index.entries.map((e) => e.label),
    replay: { load: loadReplay, create: createReplay, clip: sequenceClip },
    onPractise: () => alert('In the app this opens the camera.'),
    ...(params.get('text') ? { initial: params.get('text') } : {}),
  });
  window.sentenceView = view;
</script>
</body>
</html>
